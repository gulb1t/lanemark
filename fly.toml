# Fly.io, in Toronto so swimmer data stays in Canada. See docs/HOSTING.md.
app = "swimtrack"            # live at https://swimtrack.fly.dev; a copy of this repo needs its own unique name
primary_region = "yyz"       # Toronto

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

# SQLite lives on this volume, so it survives deploys. One machine only: SQLite isn't shared between machines.
[[mounts]]
  source = "swimtrack_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody is using it (costs almost nothing idle) and wakes in a couple of seconds on the next visit.
  # Before a pitch, set auto_stop_machines = "off" and min_machines_running = 1 so there's no wake-up pause.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
