name: Lanemark move to lanemark.fly.dev

# One time only, started by hand (Actions → Lanemark move to lanemark.fly.dev → Run workflow, type MOVE).
# Copies the live server from the old "swimtrack" Fly app to a new "lanemark" app: every account, password, 2FA
# secret, class and pool (the database and its encryption key), and its settings (secrets). The old app keeps serving
# until the new one is up and holds the same number of users, documents and pools; only then does the old address
# start sending people to https://lanemark.fly.dev.
#
# Needs FLY_API_TOKEN to be an ORG token (it creates an app), not the deploy token for one app.
# Values of secrets are never printed; the log shows counts only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MOVE to copy everything to lanemark.fly.dev
        required: true

concurrency:
  group: lanemark-deploy
  cancel-in-progress: false

jobs:
  move:
    name: Move to lanemark.fly.dev
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Lanemark
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      OLD: swimtrack
      NEW: lanemark
      NEW_URL: https://lanemark.fly.dev
    steps:
      - name: Confirmed?
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "MOVE" ]; then echo "::error::Type MOVE (capitals) to run the move."; exit 1; fi

      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: The token can reach the old app
        run: |
          flyctl status -a "$OLD" > /dev/null || { echo "::error::FLY_API_TOKEN can't reach the $OLD app. Save an org token from the Fly dashboard (Tokens) as FLY_API_TOKEN."; exit 1; }
          ORG=$(flyctl apps list --json | jq -r --arg a "$OLD" '.[] | select((.Name // .name) == $a) | (.Organization.Slug // .organization.slug // "personal")')
          echo "ORG=${ORG:-personal}" >> "$GITHUB_ENV"

      - name: Wake the old server
        run: |
          for id in $(flyctl machine list -a "$OLD" --json | jq -r '.[].id'); do flyctl machine start "$id" -a "$OLD" || true; done
          sleep 15

      - name: Export the data (the log shows counts only)
        run: |
          flyctl ssh console -a "$OLD" -C "env DATA_DIR=/data node /app/server/tools/data-tool.ts export" | tee export-log.txt
          grep '^users=' export-log.txt > old-counts.txt || { echo "::error::The export didn't finish. Is the old app running this repo's latest code?"; exit 1; }

      - name: Download the copy
        run: |
          flyctl ssh sftp get /data/export.db export.db -a "$OLD"
          flyctl ssh sftp get /data/export.key export.key -a "$OLD" || echo "No key file: the key is the SECRET_KEY setting, copied with the settings."
          test -s export.db

      - name: Copy the settings (values never printed)
        run: |
          umask 077
          : > new-secrets.env
          for name in $(flyctl secrets list -a "$OLD" --json | jq -r '.[] | (.Name // .name)'); do
            case "$name" in APP_URL|MOVED_TO) continue ;; esac
            value=$(flyctl ssh console -a "$OLD" -q -C "printenv $name" | tr -d '\r')
            [ -n "$value" ] && echo "::add-mask::$value"
            value=${value//swimtrack.fly.dev/lanemark.fly.dev}
            printf '%s=%s\n' "$name" "$value" >> new-secrets.env
            echo "Copied $name"
          done
          printf 'APP_URL=%s\n' "$NEW_URL" >> new-secrets.env

      - name: Create the new app and its volume
        run: |
          flyctl status -a "$NEW" > /dev/null 2>&1 || flyctl apps create "$NEW" --org "$ORG"
          if [ "$(flyctl volumes list -a "$NEW" --json | jq length)" = "0" ]; then
            flyctl volumes create lanemark_data -a "$NEW" -r yyz -s 1 -y
          fi
          flyctl secrets import -a "$NEW" --stage < new-secrets.env

      - name: Deploy to the new app
        run: |
          sed -e 's/^app = .*/app = "lanemark"/' -e 's/source = "swimtrack_data"/source = "lanemark_data"/' fly.toml > fly.lanemark.toml
          flyctl deploy -c fly.lanemark.toml -a "$NEW" --remote-only --ha=false

      - name: Put the data in and restart
        run: |
          printf 'put export.db /data/lanemark-import.db\n' | flyctl ssh sftp shell -a "$NEW"
          if [ -f export.key ]; then printf 'put export.key /data/secret-import.key\n' | flyctl ssh sftp shell -a "$NEW"; fi
          remote=$(flyctl ssh console -a "$NEW" -q -C "stat -c %s /data/lanemark-import.db" | tr -d '\r')
          [ "$remote" = "$(stat -c %s export.db)" ] || { echo "::error::The upload didn't arrive whole ($remote bytes)."; exit 1; }
          for id in $(flyctl machine list -a "$NEW" --json | jq -r '.[].id'); do flyctl machine restart "$id" -a "$NEW"; done
          sleep 15

      - name: Check nothing is missing
        run: |
          flyctl ssh console -a "$NEW" -C "env DATA_DIR=/data node /app/server/tools/data-tool.ts count" | grep '^users=' > new-counts.txt || true
          echo "Old server: $(cat old-counts.txt)"
          echo "New server: $(cat new-counts.txt)"
          cmp -s old-counts.txt new-counts.txt || { echo "::error::The counts differ, so the old address was left alone. Nothing is lost: the old app still has everything."; exit 1; }
          curl -fsS "$NEW_URL/api/health"

      - name: Send the old address to the new one
        run: flyctl secrets set -a "$OLD" MOVED_TO="$NEW_URL"

      - name: Clean up the copies
        if: always()
        run: |
          rm -f export.db export.key new-secrets.env fly.lanemark.toml
          flyctl ssh console -a "$OLD" -C "rm -f /data/export.db /data/export.key" || true
