name: Lanemark Android

on:
  push:
    paths:
      - 'Lanemark/**'
      - '.github/workflows/lanemark-android.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build test APK
    # Pinned so a runner image change (ubuntu-latest moves to 26) can't silently break the Android SDK setup.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Lanemark
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Lanemark/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # The shared test key lives in a secret, so APKs from every run install over each other.
      - name: Test signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/debug.keystore
          else
            echo "::warning::No ANDROID_TEST_KEYSTORE secret, so this APK is signed with a throwaway key and won't install over the last one."
          fi

      - run: npm run app

      - uses: actions/upload-artifact@v5
        with:
          name: lanemark-test-apk
          path: Lanemark/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
