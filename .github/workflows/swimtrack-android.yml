name: SwimTrack Android

on:
  push:
    paths:
      - 'SwimTrack/**'
      - '.github/workflows/swimtrack-android.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build test APK
    # Pinned so a runner image change (ubuntu-latest moves to 26) can't silently break the Android SDK setup.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SwimTrack
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SwimTrack/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - run: npm run app

      - uses: actions/upload-artifact@v5
        with:
          name: swimtrack-test-apk
          path: SwimTrack/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
